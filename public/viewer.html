<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeVinci Viewer</title>
</head>
<body>
<script>
window.addEventListener('message', async (event) => {
  if (event.data && event.data._id === 'codevinci-init') {
    const { scriptUrl, code, origin } = event.data;

    const workerScript = document.createElement('script');
    workerScript.type = 'module';
    workerScript.src = scriptUrl;
    workerScript.dataset.origin = origin;
    document.head.appendChild(workerScript);

    await new Promise(resolve => { workerScript.onload = resolve; workerScript.onerror = resolve; });

    const userScript = document.createElement('script');
    userScript.type = 'module';
    userScript.textContent = code;
    document.body.appendChild(userScript);
  }
});
</script>
</body>
</html>
