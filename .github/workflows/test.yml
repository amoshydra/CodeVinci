name: Test

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 11
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Generate PandaCSS
        run: pnpm panda codegen
      - name: Install Playwright chromium
        run: npx playwright install chromium
      - name: Build
        run: pnpm run build
      - name: Run e2e tests
        run: pnpm test:e2e
        env:
          CI: true
